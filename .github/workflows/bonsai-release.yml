name: build-bonsai-llama-cpp

on:
  push:
    branches:
      - main
      - master
      - dev
      - "feature/**"
  pull_request:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-cpu
            cmake_flags: ""
            archive_name: llama-bonsai-linux-cpu.tar.gz

          - os: macos-14
            name: macos-metal
            cmake_flags: "-DGGML_METAL=ON"
            archive_name: llama-bonsai-macos-metal.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake ninja

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_flags }}

      - name: Build
        run: |
          cmake --build build --parallel --target \
            llama-cli \
            llama-server \
            llama-bench

      - name: Show outputs
        run: |
          ls -lah build/bin || true

      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist

          cp -v build/bin/llama-cli dist/ || true
          cp -v build/bin/llama-server dist/ || true
          cp -v build/bin/llama-bench dist/ || true

          cat > dist/BUILD-INFO.txt <<EOF
          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Ref: ${{ github.ref }}
          Workflow: ${{ github.workflow }}
          Runner OS: ${{ runner.os }}
          Build flags: ${{ matrix.cmake_flags }}
          EOF

          tar -czf "${{ matrix.archive_name }}" -C dist .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.archive_name }}

      - name: Upload asset to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "${{ matrix.archive_name }}" \
            --clobber
